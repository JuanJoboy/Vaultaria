name: Mirror to Anonymous Repo

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: main-repo
          persist-credentials: false

      - name: Checkout IchorLabs repository code
        uses: actions/checkout@v4
        with:
          repository: IchorLabs/Vaultaria
          token: ${{ secrets.ICHOR_LABS_PAT }}
          path: anon-repo
          persist-credentials: false

      - name: Sync changes and commit to IchorLabs
        env:
          PAT_TOKEN: ${{ secrets.ICHOR_LABS_PAT }}
        run: |
          # 1. Capture original commit message
          cd main-repo
          COMMIT_MSG=$(git log -1 --pretty=%B)
          cd ..

          # 2. Sync code files (excluding .git and .github)
          rsync -av --delete --exclude='.git' --exclude='.github' main-repo/ anon-repo/

          # 3. Commit and push from inside IchorLabs folder
          cd anon-repo
          git config user.name "IchorLabs"
          git config user.email "317717161+IchorLabs@users.noreply.github.com"

          # Remove .github directory if it exists on IchorLabs
          git rm -rf .github/ || true

          git add -A
          
          # Force commit and push
          echo "$COMMIT_MSG" | git commit -F - || true
          git push https://x-access-token:${PAT_TOKEN}@github.com/IchorLabs/Vaultaria.git HEAD:main --force