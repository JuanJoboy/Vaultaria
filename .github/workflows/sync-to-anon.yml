name: Mirror to Anonymous Repo

on:
  push:
    branches:
      - main
      - master

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Re-author and push to anonymous repository
        env:
          PAT_TOKEN: ${{ secrets.ICHOR_LABS_PAT }}
        run: |
          git config user.name "IchorLabs"
          git config user.email "317717161+IchorLabs@users.noreply.github.com"

          # Create a clean, unlinked branch containing the latest code state
          git checkout --orphan anon-sync
          git add -A
          git commit -m "Update Vaultaria code"

          # Force push to IchorLabs repository using the explicit PAT secret
          git push https://x-access-token:${PAT_TOKEN}@github.com/IchorLabs/Vaultaria.git anon-sync:main --force